# ==============================================================================
# NIIT University Knowledge Assistant - Production Nginx Configuration
# Tier 1 Presentation Web Tier with Local SSL (mkcert) and 3-Tier Reverse Proxy
# ==============================================================================

# HTTP Server: Redirect all traffic to HTTPS (port 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Internal Docker healthcheck bypass
    location /healthz {
        proxy_pass http://nu-knowledge-api-gateway:4000/healthz;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: Real Local SSL with Trusted mkcert Certificates
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Static Web Presentation (Apple Liquid Glass UI)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Tier 2 Reverse Proxy: All API requests flow to Node.js Express Gateway
    location /api/ {
        proxy_pass http://nu-knowledge-api-gateway:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger Documentation UI (Reachable at https://localhost/api/docs or https://localhost/docs)
    location /docs {
        proxy_pass http://nu-knowledge-api-gateway:4000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://nu-knowledge-api-gateway:4000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Express Gateway Direct Telemetry
    location /gateway/ {
        proxy_pass http://nu-knowledge-api-gateway:4000/gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health & Readiness Probes
    location /healthz {
        proxy_pass http://nu-knowledge-api-gateway:4000/healthz;
    }

    location /readyz {
        proxy_pass http://nu-knowledge-api-gateway:4000/readyz;
    }
}
