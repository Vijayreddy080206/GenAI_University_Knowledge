# ==============================================================================
# NIIT University - Generative AI-Based University Knowledge Assistant
# Full Microservice Docker Compose Specification (Matches SDD & Presentation)
# Includes: Frontend Web Tier, Node.js API Gateway, FastAPI RAG Backend
# ==============================================================================

version: "3.9"

services:
  # 1. Frontend Web Presentation Tier (Nginx Web Server)
  nu-knowledge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vijayreddy080206/genai-university-frontend:latest
    container_name: nu-knowledge-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "3000:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - nu-knowledge-api-gateway
      - nu-knowledge-backend
    networks:
      - nu-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. API Gateway Microservice (Node.js + Express REST Gateway)
  nu-knowledge-api-gateway:
    build:
      context: ./express-gateway
      dockerfile: Dockerfile
    image: vijayreddy080206/genai-university-gateway:latest
    container_name: nu-knowledge-api-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PYTHON_RAG_BACKEND=http://nu-knowledge-backend:8000
    depends_on:
      - nu-knowledge-backend
    networks:
      - nu-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:4000/gateway/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Core RAG Orchestrator & Knowledge API Microservice (Python FastAPI)
  nu-knowledge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vijayreddy080206/genai-university-knowledge:latest
    container_name: nu-knowledge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Generative AI-Based University Knowledge Assistant
      - VERSION=1.0.0
      - CHUNK_SIZE_TOKENS=500
      - CHUNK_OVERLAP_TOKENS=50
      - TOP_K_CHUNKS=5
      - SIMILARITY_THRESHOLD=0.18
      - SESSION_INACTIVITY_TIMEOUT_MIN=30
      - LLM_MODEL_NAME=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nu-capstone-team20-k8s-secret-key-2026}
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nu-network

  # 4. Production PostgreSQL Database (Optional / Production Profile)
  postgres-db:
    image: postgres:16-alpine
    container_name: nu-postgres-db
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nu_knowledge_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nu_university_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nu_knowledge_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nu-network

networks:
  nu-network:
    driver: bridge
    name: nu-university-network

volumes:
  postgres_data:
    driver: local
