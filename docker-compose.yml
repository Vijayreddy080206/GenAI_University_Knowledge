version: "3.9"

services:
  # 1. Core API Gateway & Application Microservice
  nu-knowledge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vijayreddy080206/genai-university-knowledge:latest
    container_name: nu-knowledge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Generative AI-Based University Knowledge Assistant
      - VERSION=1.0.0
      - CHUNK_SIZE_TOKENS=500
      - CHUNK_OVERLAP_TOKENS=50
      - TOP_K_CHUNKS=5
      - SIMILARITY_THRESHOLD=0.18
      - SESSION_INACTIVITY_TIMEOUT_MIN=30
      - LLM_MODEL_NAME=gemini-2.5-flash
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nu-capstone-team20-k8s-secret-key-2026}
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nu-network

  # 2. Production PostgreSQL Database (Optional / Production Profile)
  # Activated with: docker compose --profile prod up
  postgres-db:
    image: postgres:16-alpine
    container_name: nu-postgres-db
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nu_knowledge_assistant
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=nu_university_secret_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nu_knowledge_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nu-network

networks:
  nu-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
