# SDD Section 5.5.1 & Appendix B.7: ML Inference & Embedding Service in ml-inference namespace
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
  namespace: ml-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      containers:
        - name: llm-inference
          image: ghcr.io/vijayreddy080206/nu-knowledge-assistant-backend:1.0.0
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: llm-svc
  namespace: ml-inference
spec:
  selector:
    app: llm-inference
  ports:
    - port: 8000
      targetPort: 8000
