# SDD Section 5.5.1 & Appendix B.7: Backend Microservices (chat-orchestrator, rag-svc, admin-service, auth-svc)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-orchestrator
  namespace: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chat-orchestrator
  template:
    metadata:
      labels:
        app: chat-orchestrator
    spec:
      containers:
        - name: chat-orchestrator
          image: ghcr.io/vijayreddy080206/nu-knowledge-assistant-backend:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nu-assistant-config
            - secretRef:
                name: nu-assistant-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: chat-svc
  namespace: backend
spec:
  selector:
    app: chat-orchestrator
  ports:
    - port: 8000
      targetPort: 8000
---
