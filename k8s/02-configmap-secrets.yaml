# SDD Section 5.4.1 & NFR-SEC-02: ConfigMaps for RAG parameters & Secrets for API/DB credentials
apiVersion: v1
kind: ConfigMap
metadata:
  name: nu-assistant-config
  namespace: backend
data:
  CHUNK_SIZE_TOKENS: "500"
  CHUNK_OVERLAP_TOKENS: "50"
  TOP_K_CHUNKS: "5"
  SIMILARITY_METRIC: "cosine"
  SIMILARITY_THRESHOLD: "0.18"
  CONVERSATION_WINDOW_TURNS: "5"
  LLM_TEMPERATURE: "0.1"
  LLM_REQUEST_TIMEOUT_SEC: "20"
  MAX_UPLOAD_SIZE_MB: "25"
  SESSION_INACTIVITY_TIMEOUT_MIN: "30"
  LLM_MODEL_NAME: "gemini-2.5-flash"
---
apiVersion: v1
kind: Secret
metadata:
  name: nu-assistant-secrets
  namespace: backend
type: Opaque
stringData:
  DATABASE_URL: "postgresql://nu_admin:REPLACE_AT_DEPLOY_TIME@postgres-db.data.svc.cluster.local:5432/nu_knowledge_db"
  JWT_SECRET_KEY: "REPLACE_WITH_K8S_RUNTIME_SECRET"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_API_KEY"
